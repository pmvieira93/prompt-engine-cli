# On a new tag: test, build prompt-engine for macOS and Linux, and publish
# a release named after the tag, with the archives, their checksums, and
# notes listing what was merged since the previous tag. A tag with a
# hyphen (v1.2.0-rc.1) makes a pre-release. Then the new release is
# installed with install.sh on Linux and macOS, so a release that can't be
# installed fails here.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, for the notes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist

      - name: Write release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"

  check-install:
    name: Install check (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the release
        run: |
          ./install.sh --from release --binary-only --version "$GITHUB_REF_NAME" --prefix "$RUNNER_TEMP/bin"
          got="$("$RUNNER_TEMP/bin/prompt-engine" --pe-version)"
          echo "$got"
          [ "$got" = "prompt-engine $GITHUB_REF_NAME" ]
