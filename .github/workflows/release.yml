# On a new tag: test, build prompt-engine for macOS and Linux, and publish
# a release named after the tag, with the archives, their checksums, and
# notes listing what was merged since the previous tag. A tag with a
# hyphen (v1.2.0-rc.1) makes a pre-release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the notes

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist

      - name: Write release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"
