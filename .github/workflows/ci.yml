# Tests every push to every branch, on Linux and macOS: a feature branch
# as it's pushed, and master after each merge. A pull request shows the
# run for its branch's commit, so there's no pull_request trigger: with
# one, each commit of an open pull request was tested twice.
name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o bin/prompt-engine ./cmd/prompt-engine

      - name: End-to-end tests
        run: scripts/e2e.sh

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck -s bash install.sh scripts/*.sh
