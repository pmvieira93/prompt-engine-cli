<svg xmlns="http://www.w3.org/2000/svg" width="850" height="292" viewBox="0 0 850 292" role="img" aria-label="Pilot, one run per task and setup: too few runs to compare"><title>Pilot, one run per task and setup: too few runs to compare</title><style>
svg { --surface: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --grid: #e6e5e1;
